          linhas = [
              f"📧 EMAIL FRIO — {hoje}",
              f"🎯 Nicho: Academias, Pilates, Yoga e Personal Trainer | {len(prospects)} negócios pesquisados",
              "━━━━━━━━━━━━━━━━━━",
              f"✅ Enviados: {len(enviados)}",
              f"❌ Erros: {len(erros)}",
              "",
          ]
          for p in enviados:
              linhas.append(f"• {p['nome']} — {p['cidade']} → {p['email']} ({p['tipo']})")

          if erros:
              linhas.append("")
              linhas.append("❌ Erros:")
              for e in erros:
                  linhas.append(f"  • {e['prospect']['nome']}: {e['erro']}")

          relatorio = "\n".join(linhas)

          # Split if > 2000 chars
          chunks = []
          while len(relatorio) > 1900:
              split_at = relatorio[:1900].rfind("\n")
              chunks.append(relatorio[:split_at])
              relatorio = relatorio[split_at:]
          chunks.append(relatorio)

          for chunk in chunks:
              data = json.dumps({"content": chunk}).encode("utf-8")
              req = urllib.request.Request(
                  DISCORD_WEBHOOK,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  urllib.request.urlopen(req, timeout=10)
                  print("Discord: relatório enviado")
              except Exception as e:
                  print(f"Discord ERRO: {e}")
              time.sleep(1)

          print(f"\n=== RESUMO: {len(enviados)}/{len(prospects)} emails enviados ===")
          PYEOF
